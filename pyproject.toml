[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-hydra"
version = "1.0.0"
description = "Operation Hydra: Reproducible academic digital forensics and cybercrime investigation project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<4.0",
    "networkx>=3.2,<4.0",
    "dnspython>=2.6,<3.0",
    "python-whois>=0.9,<1.0",
    "matplotlib>=3.8,<4.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
