name: Operation Hydra Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required repository structure
        run: |
          python - <<'EOF'
          from pathlib import Path
          required = [
              "README.md",
              "LICENSE",
              "AUTHORS.md",
              "CONTRIBUTING.md",
              "requirements.txt",
              "pyproject.toml",
              "docs/legal-framework.md",
              "docs/tool-justification.md",
              "reports/final-investigation-report.md",
              "evidence/manifest.json",
              "evidence/chain-of-custody.json",
              "scripts/generate_evidence.py",
              "scripts/verify_evidence.py",
              "scripts/analyze_campaign.py",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f"Missing required files: {missing}"
          print(f"Verified {len(required)} required repository files.")
          EOF

      - name: Verify evidence integrity (offline)
        run: python scripts/verify_evidence.py

      - name: Execute offline campaign analysis pipeline
        run: python scripts/analyze_campaign.py

      - name: Run unit tests
        run: pytest -v

      - name: Lint Markdown documentation
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            AUTHORS.md
            CONTRIBUTING.md
            docs/*.md
            reports/final-investigation-report.md
            samples/malware/README.md
